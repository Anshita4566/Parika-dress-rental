<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rento — Rent Designer Dresses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">Parika<span>.</span></a>
    <div class="nav-links" id="nav-auth-slot"></div>
  </nav>

  <section class="hero">
    <p class="eyebrow">Wear it once, own it never</p>
    <h1>Designer dresses, rented for your moment</h1>
    <p>Your dream dress is closer than you think — and more affordable than ever.</p>
  </section>

  <div class="filters">
    <input type="text" id="search-input" placeholder="Search dresses..." />
    <select id="category-select">
      <option value="">All Categories</option>
      <option value="Party Wear">Party Wear</option>
      <option value="Wedding">Wedding</option>
      <option value="Ethnic">Ethnic</option>
      <option value="Western">Western</option>
    </select>
    <select id="gender-select">
      <option value="">All (Male & Female)</option>
      <option value="Female">Female</option>
      <option value="Male">Male</option>
    </select>
  </div>

  <div class="grid" id="product-grid"></div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
