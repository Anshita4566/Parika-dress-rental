<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Parika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">Parika<span>.</span></a>
    <div class="nav-links" id="nav-auth-slot"></div>
  </nav>

  <div class="form-wrap">
    <h2>Set new password</h2>
    <form id="reset-form">
      <input type="password" id="password" placeholder="New password (min 6 characters)" required />
      <button type="submit" class="btn btn-primary">Update password</button>
      <p id="form-msg" class="form-msg"></p>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("form-msg");
      msg.textContent = "";
      msg.className = "form-msg";
      try {
        const data = await apiRequest("/auth/reset-password", "POST", {
          token,
          password: document.getElementById("password").value,
        });
        msg.textContent = data.message;
        msg.className = "form-msg success";
        setTimeout(() => (window.location.href = "login.html"), 1500);
      } catch (err) {
        msg.textContent = err.message;
        msg.className = "form-msg error";
      }
    });
  </script>
</body>
</html>
