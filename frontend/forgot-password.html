<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Parika</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">Parika<span>.</span></a>
    <div class="nav-links" id="nav-auth-slot"></div>
  </nav>

  <div class="form-wrap">
    <h2>Forgot password</h2>
    <form id="forgot-form">
      <input type="email" id="email" placeholder="Your registered email" required />
      <button type="submit" class="btn btn-primary">Send reset link</button>
      <p id="form-msg" class="form-msg"></p>
    </form>
    <p style="text-align:center; margin-top:14px; font-size:0.9rem;">
      <a href="login.html" style="color:var(--color-accent); font-weight:600;">Back to login</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("form-msg");
      msg.textContent = "Sending...";
      msg.className = "form-msg";
      try {
        const data = await apiRequest("/auth/forgot-password", "POST", {
          email: document.getElementById("email").value.trim(),
        });
        msg.textContent = data.message;
        msg.className = "form-msg success";
      } catch (err) {
        msg.textContent = err.message;
        msg.className = "form-msg error";
      }
    });
  </script>
</body>
</html>
